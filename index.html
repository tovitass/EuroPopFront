<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>European Popular Front</title>
    <meta
      name="description"
      content="European Popular Front social media toolkit: bold, clean, direct visual language."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Oswald:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <div class="bg-number" aria-hidden="true">1</div>
      <h1>EUROPEAN POPULAR FRONT</h1>
      <div class="red-line thick"></div>
      <p>WE BUILD A UNITED, LEFT, ANTI-FASCIST EUROPE.</p>
    </header>

    <main>
      <section class="card statement" aria-labelledby="statement-title">
        <h2 id="statement-title">STATEMENT</h2>
        <div class="red-line thin"></div>
        <p class="big-quote">EUROPE NEEDS COURAGE.</p>
      </section>

      <section class="card contrast" aria-labelledby="contrast-title">
        <h2 id="contrast-title">CONTRAST</h2>
        <div class="red-line thin"></div>
        <p class="versus"><span>EXCLUSION</span> <strong>≠</strong> <span>SOLIDARITY</span></p>
      </section>

      <section class="card mini-slide" aria-labelledby="slide-title">
        <h2 id="slide-title">MINI-SLIDE</h2>
        <div class="red-line thin"></div>
        <ul>
          <li>✔ WE ORGANIZE ACROSS BORDERS.</li>
          <li>✔ WE FIGHT FASCISM, ALWAYS.</li>
          <li>✖ WE REJECT FEAR POLITICS.</li>
        </ul>
      </section>
    </main>

    <footer>
      <div class="red-line thick"></div>
      <p>DIRECT. BOLD. UNITED.</p>
    </footer>
  </body>
</html>
