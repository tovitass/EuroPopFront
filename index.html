<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="siteTitle">{{orgFullName}} | Official Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Oswald:wght@600;700;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.png">
</head>
<body>

    <div class="site-container">
        <!-- Top bar. It has a logo, buttons, and a strongg desire to stay black. -->
        <header class="site-header">
            <a href="pages/home-grid.html" target="content-frame" class="brand">
                <img src="https://pbs.twimg.com/profile_images/2041811697007005696/0KXWhOI8_400x400.jpg" alt="{{orgLogoAlt}}" data-i18n-attr="alt:orgLogoAlt">
                <span data-i18n="orgFullName">{{orgFullName}}</span>
                <span class="translation-credit" data-translation-credit>Translation by {{orgShortName}}</span>
            </a>
            <nav class="top-nav">
                <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false">
                    <span data-theme-icon aria-hidden="true">◐</span>
                    <span data-theme-label>DARK</span>
                </button>
                <div class="language-picker" data-language-picker>
                    <button type="button" class="language-toggle" data-language-toggle data-language-current aria-expanded="false">EN</button>
                    <div class="language-menu" aria-label="Choose language">
                        <input type="search" class="language-menu-search" data-language-search placeholder="Search languages…" aria-label="Search languages">
                        <div class="language-menu-list"></div>
                    </div>
                </div>
                <a class="home-button" href="pages/home-grid.html" target="content-frame" aria-label="Home" title="Home">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 10.8 12 3l9 7.8M5.5 9.2V21h13V9.2M9.5 21v-7h5v7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/></svg>
                </a>
            </nav>
        </header>

        <!-- Main portal zone. The iframe is where the smaller webpage hides inside the bigger webpage. -->
        <main class="page-shell">
            <section class="hero-panel">
                <div class="hero-copy">
                    <h1 class="hero-title" data-i18n-html="heroTitle">UNITED WE <span>BARGAIN.</span><br>
                        DIVIDED WE <span>BEG.</span></h1>
                    <div class="hero-support">
                        <p data-i18n="heroSupportOne">Working together gives people across Europe a stronger voice.</p>
                        <p data-i18n="heroSupportTwo">Organise across borders. Build a fairer, more united Europe.</p>
                    </div>
                </div>
                <img src="https://pbs.twimg.com/profile_images/2041811697007005696/0KXWhOI8_400x400.jpg" class="hero-emblem" alt="{{orgLogoAlt}}" data-i18n-attr="alt:orgLogoAlt">
            </section>

            <iframe src="pages/home-grid.html" name="content-frame" class="portal-frame" frameborder="0" allowtransparency="true" data-translatable-frame></iframe>
        </main>
    </div>

    <!-- Background poster confetti. JS throws images in here -->
    <div id="background-scatter" class="bg-decorations"></div>
    <script src="translations.js"></script>
    <script src="scatter.js"></script>
</body>
</html>
