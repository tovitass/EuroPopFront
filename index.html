<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>European Popular Front — Under Construction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&family=Oswald:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
    --primary-red: #ff0052;
    --bg-white: #fffffd;
    --text-grey: #1a1a1a;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: var(--bg-white);
    color: var(--text-grey);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
}

#halftone {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
}

/* TYPOGRAPHY */

h1,
h2,
h3,
.headline {
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
    font-weight: 900;
    line-height: 0.8;
    letter-spacing: -0.05em;
}

/* HEADER */

header {
    position: relative;
    z-index: 1;
    background: #000;
    color: white;
    border-bottom: 8px solid var(--primary-red);
    padding: 1rem 3rem;
    flex-shrink: 0;
}

.header-main {
    display: flex;
    align-items: center;
    gap: 2rem;
}

.header-inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
}

.header-title {
    font-family: 'Oswald', sans-serif;
    font-size: 2.2rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.05em;
}

.nav-logo {
    width: 45px;
    height: 45px;
    border: 3px solid white;
    background: var(--primary-red);
    flex-shrink: 0;
}

/* MAIN CONTENT HOLDER */

main {
    position: relative;
    z-index: 1;
    flex-grow: 1;
    overflow: hidden;
}

.bento-container {
    height: 100%;
    padding: 2rem 3rem 3rem 3rem;
    display: flex;
    align-items: center;
}

/* HERO BOX */
.hero-box {
    width: 100%;
    display: flex;
    align-items: center;
    padding: 4rem;
    background: white;
    border: 8px solid #000;
    box-shadow: 12px 12px 0px 0px #000;
}

.headline {
    font-size: clamp(3rem, 5vw, 6rem);
    line-height: 0.9;
    margin-bottom: 1rem;
}

.hero-pink {
    color: var(--primary-red);
}

/* ELEMENTS */

.label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    opacity: 0.5;
    margin-bottom: 1.5rem;
}

.label::before {
    content: "● ";
    color: var(--primary-red);
}

/* DISCORD LINK STUFF */

.discord-text {
    max-width: 700px;
    margin-top: 28px;
    margin-bottom: 20px;
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    line-height: 1.6;
}

.discord-button {
    display: inline-block;
    padding: 14px 22px;
    background: var(--primary-red);
    color: #fff;
    text-decoration: none;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    border: 2px solid var(--primary-red);
    transition: all 0.2s ease;
}

.discord-button:hover {
    background: transparent;
    color: var(--primary-red);
    transform: translateY(-2px);
}

.discord-button:focus-visible {
    outline: 3px solid #000;
    outline-offset: 3px;
}

/* RESPONSIVE DESIGN */

@media (max-width: 900px) {
    body {
        overflow-y: auto;
        height: auto;
    }

    .bento-container {
        padding: 2rem 1.5rem;
    }

    .hero-box {
        padding: 2rem;
        min-height: 40vh;
        box-shadow: 8px 8px 0px 0px #000;
    }

    .headline {
        font-size: 2.5rem;
    }

    .header-main {
        gap: 1rem;
    }

    .header-title {
        font-size: 1.6rem;
    }

    .discord-text {
        font-size: 0.95rem;
    }

    .discord-button {
        padding: 12px 18px;
        font-size: 0.85rem;
    }
}

/* MOTION */

@media (prefers-reduced-motion: reduce) {
    .discord-button {
        transition: none;
    }
}
</style>
</head>
<body>
  <canvas id="halftone" aria-hidden="true"></canvas>

  <header>
    <div class="header-main">
      <div class="nav-logo" aria-hidden="true"></div>
      <div class="header-inner">
        <div class="header-title">European Popular Front</div>
      </div>
    </div>
  </header>

  <main>
    <div class="bento-container">
      <section class="hero-box">
        <div>
          <div class="label">Status // 2026</div>
          <h1 class="headline">
            This site is <span class="hero-pink">under construction.</span>
          </h1>
          <p class="discord-text">
            We're building. In the meantime, come join the conversation on Discord:
          </p>
          <a
            href="https://discord.gg/hbZr3TMC8J"
            class="discord-button"
            target="_blank"
            rel="noopener noreferrer"
          >
            Join the discussion on Discord →
          </a>
        </div>
      </section>
    </div>
  </main>

  <script>
    (function () {
      var canvas = document.getElementById('halftone');
      var ctx = canvas.getContext('2d');
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      var DPR = Math.min(window.devicePixelRatio || 1, 2);
      var GAP = 30;
      var BASE_R = 1.6;
      var MAX_R = 7;
      var RADIUS = 190;

      var w, h, cols, rows;
      var mouse = { x: -9999, y: -9999 };
      var target = { x: -9999, y: -9999 };

      function resize() {
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w * DPR;
        canvas.height = h * DPR;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        cols = Math.ceil(w / GAP) + 1;
        rows = Math.ceil(h / GAP) + 1;
      }

      function draw() {
        ctx.clearRect(0, 0, w, h);

        mouse.x += (target.x - mouse.x) * 0.18;
        mouse.y += (target.y - mouse.y) * 0.18;

        for (var i = 0; i < cols; i++) {
          for (var j = 0; j < rows; j++) {
            var x = i * GAP;
            var y = j * GAP;
            var dx = x - mouse.x;
            var dy = y - mouse.y;
            var dist = Math.sqrt(dx * dx + dy * dy);
            var t = Math.max(0, 1 - dist / RADIUS);

            var r = BASE_R + (MAX_R - BASE_R) * t;
            var isRed = t > 0.02;

            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            if (isRed) {
              ctx.fillStyle = 'rgba(255, 0, 82, ' + (0.25 + 0.75 * t) + ')';
            } else {
              ctx.fillStyle = 'rgba(26, 26, 26, 0.12)';
            }
            ctx.fill();
          }
        }

        if (!reduceMotion) requestAnimationFrame(draw);
      }

      function onPointerMove(e) {
        var p = e.touches ? e.touches[0] : e;
        target.x = p.clientX;
        target.y = p.clientY;
      }

      window.addEventListener('resize', resize);
      window.addEventListener('mousemove', onPointerMove, { passive: true });
      window.addEventListener('touchmove', onPointerMove, { passive: true });
      window.addEventListener('mouseleave', function () {
        target.x = -9999;
        target.y = -9999;
      });

      resize();

      if (reduceMotion) {
        draw();
      } else {
        requestAnimationFrame(draw);
      }
    })();
  </script>
</body>
</html>
