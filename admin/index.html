<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Decap CMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { font-family: Inter, system-ui, sans-serif; color: #fff; background: #040404; padding: 2rem; }
      .admin-fallback { max-width: 52rem; margin: 0 auto; line-height: 1.8; }
      a { color: #e63946; font-weight: 700; }
    </style>
    <script src="https://unpkg.com/netlify-cms@^2.0.0/dist/netlify-cms.js"></script>
  </head>
  <body>
    <div class="admin-fallback">
      <h1>EPF Admin</h1>
      <p>If Decap CMS is configured with a Git backend, this page will load the CMS editor.</p>
      <p>For now, use the editor UI at <a href="editor.html">/admin/editor.html</a> to manage Spinelli Report articles and download an updated <code>articles.json</code>.</p>
      <p>When deployed with a backend, the CMS editor will replace this fallback notice.</p>
    </div>
    <script>
      if (window.CMS) {
        window.CMS.init();
      }
    </script>
  </body>
</html>
